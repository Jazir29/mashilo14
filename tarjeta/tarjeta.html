<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tarjeta - Feliz 14, Máximo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    /* ============================================
       CONTROLES (fuera de la impresión)
       ============================================ */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, sans-serif;
      background: #1a1a24;
      color: #f5f5f7;
    }

    .controles {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10, 10, 15, 0.95);
      backdrop-filter: blur(10px);
      padding: 1rem;
      display: flex;
      justify-content: center;
      gap: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn {
      background: linear-gradient(135deg, #ff8c1a, #ff2d55);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 0.95rem;
      font-weight: 700;
      font-family: inherit;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 140, 26, 0.4);
      transition: transform 0.2s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn.secundario {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: none;
    }

    .wrapper {
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }

    /* ============================================
       TARJETA A4 VERTICAL (210 x 297 mm)
       ============================================ */
    .tarjeta {
      width: 210mm;
      height: 297mm;
      background: linear-gradient(135deg, #0a0a0f 0%, #1a1a24 50%, #2a1a1a 100%);
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      color: #f5f5f7;
      display: flex;
      flex-direction: column;
      padding: 20mm 15mm;
    }

    /* Fondo: collage de fotos sutil */
    .fondo-collage {
      position: absolute;
      inset: 0;
      z-index: 0;
      opacity: 0.12;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 2mm;
      padding: 10mm;
    }
    .fondo-collage img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 2mm;
      filter: grayscale(60%) contrast(1.1);
    }

    /* Overlay oscuro para contraste */
    .fondo-collage::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(10, 10, 15, 0.5) 0%, rgba(10, 10, 15, 0.9) 70%, rgba(10, 10, 15, 1) 100%);
      z-index: 1;
    }

    /* Esferas del dragón decorativas */
    .orb {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffd57a, #ff8c1a 50%, #c45500 100%);
      box-shadow: 0 0 30px rgba(255, 140, 26, 0.5);
      opacity: 0.9;
      z-index: 2;
    }
    .orb::before {
      content: "★";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(200, 50, 0, 0.6);
      font-size: 55%;
    }
    .orb-tr { width: 18mm; height: 18mm; top: 10mm; right: 10mm; }
    .orb-bl { width: 14mm; height: 14mm; bottom: 15mm; left: 12mm; }
    .orb-tl { width: 10mm; height: 10mm; top: 25mm; left: 18mm; }

    /* Contenido en primer plano */
    .contenido {
      position: relative;
      z-index: 3;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
    }

    .header-top {
      width: 100%;
    }
    .etiqueta {
      font-size: 10pt;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #ff8c1a;
      font-weight: 600;
      margin-bottom: 4mm;
    }
    .titulo-tarjeta {
      font-size: 42pt;
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1;
      margin-bottom: 2mm;
      background: linear-gradient(135deg, #fff 0%, #ffb04a 50%, #ff8c1a 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .nombre-tarjeta {
      font-family: 'Caveat', cursive;
      font-size: 32pt;
      color: #ffb04a;
      margin-top: 2mm;
    }

    /* QR SECTION */
    .qr-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5mm;
    }
    .qr-marco {
      background: white;
      padding: 6mm;
      border-radius: 4mm;
      box-shadow: 0 10px 30px rgba(255, 140, 26, 0.3);
      position: relative;
    }
    .qr-marco::before, .qr-marco::after {
      content: "";
      position: absolute;
      width: 8mm;
      height: 8mm;
      border: 3px solid #ff8c1a;
    }
    .qr-marco::before {
      top: -3mm; left: -3mm;
      border-right: none;
      border-bottom: none;
      border-top-left-radius: 2mm;
    }
    .qr-marco::after {
      bottom: -3mm; right: -3mm;
      border-left: none;
      border-top: none;
      border-bottom-right-radius: 2mm;
    }
    #qr canvas, #qr img {
      display: block;
      width: 70mm !important;
      height: 70mm !important;
    }
    .qr-instruccion {
      font-size: 11pt;
      color: #9b9ba8;
      font-weight: 600;
      letter-spacing: 0.05em;
    }
    .qr-instruccion strong {
      color: #ffb04a;
    }

    /* MENSAJE */
    .mensaje {
      font-size: 13pt;
      line-height: 1.7;
      max-width: 150mm;
      color: #e5e5ea;
    }
    .mensaje p {
      margin: 0 0 3mm;
    }
    .mensaje .destacado {
      color: #ffb04a;
      font-weight: 600;
    }

    .firma {
      font-family: 'Caveat', cursive;
      font-size: 22pt;
      color: #ffb04a;
      margin-top: 3mm;
    }

    /* Esquinas decorativas */
    .esquina {
      position: absolute;
      width: 15mm;
      height: 15mm;
      border: 2px solid rgba(255, 140, 26, 0.5);
      z-index: 2;
    }
    .esquina.tl { top: 8mm; left: 8mm; border-right: none; border-bottom: none; }
    .esquina.tr { top: 8mm; right: 8mm; border-left: none; border-bottom: none; }
    .esquina.bl { bottom: 8mm; left: 8mm; border-right: none; border-top: none; }
    .esquina.br { bottom: 8mm; right: 8mm; border-left: none; border-top: none; }

    /* ============================================
       MODO IMPRESIÓN
       ============================================ */
    @page {
      size: A4 portrait;
      margin: 0;
    }

    @media print {
      body { background: white; }
      .controles { display: none; }
      .wrapper { padding: 0; }
      .tarjeta {
        box-shadow: none;
        width: 210mm;
        height: 297mm;
        page-break-after: always;
      }
    }
  </style>
</head>
<body>

  <!-- CONTROLES (no se imprimen) -->
  <div class="controles">
    <button class="btn" onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>
    <button class="btn secundario" onclick="window.open('../web/index.html', '_blank')">👁️ Ver la web</button>
  </div>

  <!-- TARJETA -->
  <div class="wrapper">
    <article class="tarjeta">

      <!-- Fondo collage -->
      <div class="fondo-collage" id="fondoCollage"></div>

      <!-- Esferas decorativas -->
      <div class="orb orb-tr"></div>
      <div class="orb orb-bl"></div>
      <div class="orb orb-tl"></div>

      <!-- Esquinas decorativas -->
      <div class="esquina tl"></div>
      <div class="esquina tr"></div>
      <div class="esquina bl"></div>
      <div class="esquina br"></div>

      <!-- Contenido -->
      <div class="contenido">

        <div class="header-top">
          <p class="etiqueta">14 años · un regalo distinto</p>
          <h1 class="titulo-tarjeta">FELIZ CUMPLE</h1>
          <p class="nombre-tarjeta">Máximo</p>
        </div>

        <div class="qr-section">
          <div class="qr-marco">
            <div id="qr"></div>
          </div>
          <p class="qr-instruccion">📱 <strong>Escanea</strong> con la cámara de tu celular</p>
        </div>

        <div class="mensaje">
          <p>Que la pases increíble, bro.</p>
          <p class="destacado">Nunca pierdas esa alma de niño que tienes —<br/>es tu mejor parte.</p>
          <p class="firma">— Jazir</p>
        </div>

      </div>
    </article>
  </div>

  <script>
    // --- CONFIGURACIÓN ---
    const URL_DESTINO = 'https://jazir29.github.io/mashilo14/';

    // Imágenes del collage de fondo (las de la carpeta web/assets/)
    const FOTOS_COLLAGE = [
      '../docs/assets/4.jpg',
      '../docs/assets/5.jpg',
      '../docs/assets/7.jpg',
      '../docs/assets/8.jpg',
      '../docs/assets/9.jpg',
      '../docs/assets/10.jpg',
      '../docs/assets/11.jpg',
      '../docs/assets/12.jpg'
    ];

    // --- RENDERIZAR COLLAGE ---
    const collage = document.getElementById('fondoCollage');
    // repetimos las fotos para llenar la grilla (20 celdas)
    for (let i = 0; i < 20; i++) {
      const img = document.createElement('img');
      img.src = FOTOS_COLLAGE[i % FOTOS_COLLAGE.length];
      img.alt = '';
      collage.appendChild(img);
    }

    // --- GENERAR QR ---
    const canvas = document.createElement('canvas');
    document.getElementById('qr').appendChild(canvas);
    QRCode.toCanvas(canvas, URL_DESTINO, {
      width: 400,
      margin: 1,
      color: {
        dark: '#0a0a0f',
        light: '#ffffff'
      },
      errorCorrectionLevel: 'H'
    }, function (error) {
      if (error) console.error(error);
    });
  </script>
</body>
</html>
